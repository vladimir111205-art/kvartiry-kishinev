name: testy

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости
        run: pip install -r requirements-dev.txt
      # Тесты офлайн по правилу проекта: ни один не ходит в сеть.
      - name: Тесты
        run: pytest -q
